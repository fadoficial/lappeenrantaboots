<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lappeenranta Bootstrap</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        .hero { background: #343a40; color: white; padding: 60px 0; text-align: center; }
        img { max-width: 100%; height: auto; border-radius: 8px; }
        section { padding: 40px 0; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">LPR</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="#historia">Historia</a>
                <a class="nav-link" href="#matkailu">Matkailu</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Lappeenranta</h1>
            <p>Bootstrap-versio</p>
        </div>
    </header>

    <main class="container">
        <section id="historia" class="row align-items-center">
            <div class="col-md-6"><img src="historia.jpg" alt="Historia"></div>
            <div class="col-md-6">
                <h2>Historia</h2>
                <p>Lappeenranta on hieno kaupunki Saimaan rannalla.</p>
            </div>
        </section>

        <section id="matkailu" class="row g-4 text-center">
            <div class="col-md-4"><div class="card p-3 shadow-sm"><img src="satama.jpg" class="mb-2"><h5>Satama</h5></div></div>
            <div class="col-md-4"><div class="card p-3 shadow-sm"><img src="linnoitus.jpg" class="mb-2"><h5>Linnoitus</h5></div></div>
            <div class="col-md-4"><div class="card p-3 shadow-sm"><img src="canal.jpg" class="mb-2"><h5>Kanava</h5></div></div>
        </section>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 Aleksei Krotkov</p>
    </footer>
</body>
</html>
